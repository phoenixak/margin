name: Feature request
description: Suggest something Margin should do. (New model providers have their own template.)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What are you trying to do?, description: "The situation and what gets in the way today." }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would help, description: "Your idea. Rough is fine." }
  - type: dropdown
    id: where
    attributes: { label: Where, multiple: true, options: [VS Code, Obsidian, Chrome, Firefox, margin-ls, CLI, All of them] }
  - type: markdown
    attributes:
      value: |
        Margin stays a minimal second pass after Harper: it fixes errors and doesn't restyle your writing unless you ask for a rewrite. Ideas that keep that, or make local models easier to run, fit best.
