name: Obsidian release

# Push a tag equal to the Obsidian plugin version (e.g. 0.1.1) to build the plugin from
# that commit, attest the files' provenance, and publish them as the GitHub release
# Obsidian installs from.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @margin/obsidian build
      - name: Check the tag matches the manifest version
        run: |
          v=$(node -p "require('./packages/obsidian/dist/manifest.json').version")
          test "$v" = "${GITHUB_REF_NAME}" || { echo "manifest version $v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/obsidian/dist/main.js
            packages/obsidian/dist/manifest.json
            packages/obsidian/dist/styles.css
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packages/obsidian/dist/main.js packages/obsidian/dist/manifest.json packages/obsidian/dist/styles.css \
            --title "Margin Proofreader ${GITHUB_REF_NAME} (Obsidian plugin)" \
            --notes-file packages/obsidian/RELEASE_NOTES.md
