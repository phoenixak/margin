<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Team update</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f4f2fb; font: 21px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2937; }
  header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 14px 32px; display: flex; align-items: center; gap: 12px; }
  header b { font-size: 22px; }
  header span { color: #6b7280; font-size: 18px; }
  main { max-width: 1060px; margin: 40px auto; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 22px 26px; box-shadow: 0 6px 24px rgba(31, 41, 55, .06); }
  h1 { font-size: 27px; margin: 0 0 4px; }
  .meta { color: #6b7280; font-size: 17px; margin-bottom: 16px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 230px; border: 1px solid #d1d5db; border-radius: 10px; padding: 14px 16px; font: inherit; line-height: 1.7; resize: vertical; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; color: #6b7280; font-size: 17px; }
  button { font: inherit; font-size: 18px; background: #111827; color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; }
</style>
</head>
<body>
<header><b>Northwind</b><span>/ #product-updates</span></header>
<main>
  <div class="card">
    <h1>Weekly update</h1>
    <div class="meta">Draft · visible to the product team</div>
    <textarea>Each of the release notes were reviewed by two people before Friday. Yesterday we meet the design team and agreed on the new onboarding flow. The beta results were better than expected, we decided to open it to everyone next week. Please let me know if you see anything missing.</textarea>
    <div class="bar"><span>Markdown supported</span><button>Post update</button></div>
  </div>
</main>
</body>
</html>
